<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shading widgets</title><style>body{font:15px system-ui;background:#191919;color:#eee;margin:16px}section{border:1px solid #444;border-radius:12px;padding:16px;margin:12px 0}h2{font-size:18px;margin:0 0 10px}svg{width:100%;max-height:240px}input{width:100%;accent-color:#35b8a6}small{color:#bbb}a{color:#5ddac9}</style><main id="root"></main><script>
const root=document.querySelector('#root'), mode=new URLSearchParams(location.search).get('widget');
function widget(id,title,desc,controls,draw){if(mode&&mode!==id)return;let s=document.createElement('section');s.innerHTML='<h2>'+title+'</h2><svg viewBox="0 0 360 200" role="img" aria-label="'+title+'"></svg><div></div><small>'+desc+'</small>';root.append(s);let svg=s.querySelector('svg'), panel=s.querySelector('div'), vals=controls.map(c=>c[1]);function update(){svg.innerHTML=draw(vals);panel.querySelectorAll('output').forEach((o,i)=>o.value=vals[i].toFixed(3))}controls.forEach((c,i)=>{let l=document.createElement('label');l.innerHTML=c[0]+' <output></output><input type="range" min="'+c[2]+'" max="'+c[3]+'" step="'+c[4]+'" value="'+c[1]+'">';panel.append(l);l.querySelector('input').oninput=e=>{vals[i]=+e.target.value;update()}});update()}
const teal='#35b8a6',gold='#e7a34a',line=(x,y,X,Y,c='#777')=>'<path d="M'+x+' '+y+' L'+X+' '+Y+'" stroke="'+c+'" fill="none"/>',txt=(x,y,t,c='#ddd')=>'<text x="'+x+'" y="'+y+'" fill="'+c+'" font-size="11">'+t+'</text>',curve=(f,c,x=35,y=170,w=310,h=140)=>'<path d="'+Array.from({length:301},(_,i)=>(i?'L':'M')+(x+i*w/300)+' '+(y-f(i/300)*h)).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="2.5"/>',axes=()=>line(35,20,35,170)+line(35,170,345,170)+txt(32,187,'0')+txt(338,187,'1');
widget('slope','Same height, different slopes','Equal amplitude and integer cycle counts give equal RMS height; RMS slope increases with frequency.',[['Cycles',8,2,16,1]],([n])=>[2,n].map((k,i)=>{let y=50+i*90;return line(35,y,345,y)+curve(t=>Math.sin(t*Math.PI*2*k),i?gold:teal,35,y,310,24)+txt(35,y-30,'Cycles: '+k+' | RMS slope: '+(2*Math.PI*k/Math.sqrt(2)).toFixed(2))}).join(''));
widget('variance','Height variance','Population variance = mean squared deviation. RMS deviation = square root of variance.',[['Sample A',2,0,10,1],['Sample B',4,0,10,1],['Sample C',7,0,10,1]],v=>{let m=v.reduce((a,b)=>a+b)/3,q=v.reduce((a,b)=>a+(b-m)**2,0)/3;return v.map((a,i)=>'<rect x="'+(65+i*95)+'" y="'+(150-a*12)+'" width="55" height="'+a*12+'" fill="'+teal+'"/>').join('')+line(35,150-m*12,345,150-m*12,gold)+txt(35,15,'Mean '+m.toFixed(2)+' | Variance '+q.toFixed(2)+' | RMS '+Math.sqrt(q).toFixed(2))});
widget('gamma','Perceptual roughness','Teal: alpha^0.4545. Gold: sqrt(alpha). Gray: linear. Assumes BSDF squares its input.',[['Alpha',.25,0,1,.001]],([a])=>axes()+curve(t=>t**.4545,teal)+curve(Math.sqrt,gold)+curve(t=>t,'#777')+line(35+310*a,20,35+310*a,170)+txt(45,15,'Gamma '+(a**.4545).toFixed(4)+' | sqrt '+Math.sqrt(a).toFixed(4)));
widget('ndf','GGX vs Beckmann','Peak-normalised NDF, not full BRDF. Teal: GGX. Gold: Beckmann. Horizontal axis: normal angle −80° to +80°.',[['Alpha',.3,.05,.6,.01]],([a])=>axes()+curve(t=>{let c=Math.cos((t*160-80)*Math.PI/180);return a**4/(c*c*(a*a-1)+1)**2},teal)+curve(t=>{let z=(t*160-80)*Math.PI/180;return Math.exp(-((Math.tan(z)/a)**2))/Math.cos(z)**4},gold)+txt(45,15,'GGX / Beckmann')+txt(150,190,'Normal angle'));
if(mode==='diffuse'||!mode){
const pi=Math.PI,k1=.5-2/(3*pi),k2=2/3-28/(15*pi);
function E(mu,r){let s=Math.sqrt(Math.max(0,1-mu*mu));let g=s*(Math.acos(mu)-s*mu)+2/3*(s*mu*(1+s+s*s)/(1+s)-s);return (1+r*g/pi)/(1+k1*r)}
function avg(r){return (1+k2*r)/(1+k1*r)}
function evaluate(i,o,p,r,rho){let a=Math.cos(i),b=Math.cos(o),s=Math.sin(i)*Math.sin(o)*Math.cos(p),t=s>0?Math.max(a,b):1;let fon=rho*(1+r*s/t)/(pi*(1+k1*r)),e=avg(r),d=1-e;let ms=d>1e-10?rho*rho*e*(1-E(a,r))*(1-E(b,r))/(pi*d*(1-rho*d)):0;return [rho/pi,fon,fon+ms]}
const rad=x=>x*pi/180, colors=['#aaa','#e7a34a','#35b8a6'];
widget('diffuse','Lambert vs FON vs EON','Gray: Lambert; orange: Fujii Oren–Nayar; teal: EON. BRDF × π, not cosine-weighted radiance. Roughness r is dimensionless; rho is single-scattering albedo.',[['Diffuse roughness',.8,0,1,.01],['Incident angle (degrees)',60,0,89,.1],['View angle (degrees)',45,0,89,.1],['Relative azimuth (degrees)',0,0,180,1],['Single-scattering albedo',1,0,1,.01]],([r,i,o,p,rho])=>{let data=Array.from({length:301},(_,j)=>evaluate(rad(i),rad(j*89/300),rad(p),r,rho)),max=Math.max(1,...data.flat().map(x=>x*pi)),v=evaluate(rad(i),rad(o),rad(p),r,rho);return line(35,30,35,170)+line(35,170,345,170)+txt(3,35,max.toFixed(2))+txt(35,185,'0°')+txt(318,185,'89°')+colors.map((col,k)=>curve(t=>evaluate(rad(i),rad(89*t),rad(p),r,rho)[k]*pi/max,col)).join('')+line(35+310*o/89,30,35+310*o/89,170)+txt(35,15,'L '+(v[0]*pi).toFixed(3)+' | FON '+(v[1]*pi).toFixed(3)+' | EON '+(v[2]*pi).toFixed(3))});
widget('diffuse','Directional albedo / furnace test','At rho = 1, EON returns all incident energy regardless of direction. At lower rho, absorption is expected. Gray: Lambert; orange: FON; teal: EON.',[['Diffuse roughness',.8,0,1,.01],['Single-scattering albedo',1,0,1,.01]],([r,rho])=>{let e=avg(r),d=1-e;return line(35,30,35,170)+line(35,170,345,170)+txt(4,32,'1.0')+txt(35,186,'0°')+txt(318,186,'90°')+curve(()=>rho,colors[0])+curve(t=>rho*E(Math.cos(t*pi/2),r),colors[1])+curve(t=>{let h=E(Math.cos(t*pi/2),r);return rho*h+rho*rho*e*(1-h)/(1-rho*d)},colors[2])+txt(35,15,'Furnace: reflected fraction vs angle')});
const a=document.createElement('p');a.innerHTML='<a href="https://www.jcgt.org/published/0014/01/06/" target="_blank" rel="noopener">Source: Portsmouth, Kutz & Hill, EON (JCGT 2025, revised 2026)</a>';root.append(a);
for(let r of [0,.1,.5,1])for(let mu of [0,.2,.5,1]){let e=avg(r),h=E(mu,r);if(Math.abs(h+e*(1-h)/e-1)>1e-10)throw Error('Furnace invariant failed')}
}
widget('sss','Clay subsurface transport','Conceptual paths only, not measured scattering coefficients. Longer paths can produce visible spatial transport.',[['Illustrative path scale',1,.2,2,.1]],([a])=>'<rect x="15" y="65" width="330" height="120" rx="5" fill="#a77558"/>'+line(65,20,100,65,gold)+'<path d="M100 65 l'+(15*a)+' '+(20*a)+' l'+(20*a)+' '+(12*a)+' l'+(25*a)+' '+(-10*a)+' L'+(100+85*a)+' 65 l25 -40" fill="none" stroke="#ffe28a" stroke-width="3" stroke-dasharray="5 3"/>'+txt(15,15,'Incident light → scattering → exit'));
</script></html>
