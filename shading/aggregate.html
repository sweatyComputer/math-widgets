<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggregate and binder shading</title><style>body{background:#191919;color:#eee;font:15px system-ui;margin:16px}h2{font-size:18px}input{width:100%;accent-color:#35b8a6}canvas,svg{width:100%;height:auto;border-radius:8px}label{display:block;margin:12px 0}small{color:#bbb}select{background:#333;color:white;padding:6px}</style><h2 id="title"></h2><div id="controls"></div><canvas id="preview" width="600" height="240"></canvas><p id="stats"></p><small id="note"></small><script>
const mode=new URLSearchParams(location.search).get('widget')||'material', c=document.querySelector('#preview'),ctx=c.getContext('2d'),controls=document.querySelector('#controls'),stats=document.querySelector('#stats'),note=document.querySelector('#note'),title=document.querySelector('#title');let v={material:'asphalt',wear:.25,wet:.2,coverage:.75};function slider(k,label){let el=document.createElement('label');el.innerHTML=label+' <output></output><input type="range" min="0" max="1" step=".01" value="'+v[k]+'">';controls.append(el);let o=el.querySelector('output');o.value=Math.round(v[k]*100)+'%';el.querySelector('input').oninput=e=>{v[k]=+e.target.value;o.value=Math.round(v[k]*100)+'%';draw()}}
if(mode==='material'){title.textContent='Concrete / asphalt: wear and wetness';controls.innerHTML='<label>Material <select><option value="asphalt">Asphalt</option><option value="concrete">Concrete</option></select></label>';controls.querySelector('select').onchange=e=>{v.material=e.target.value;draw()};slider('wear','Mechanical wear');slider('wet','Wetness')}else{title.textContent=mode==='coverage'?'Bitumen coverage':'Spatial BSDF mix versus vertical coat';slider('coverage','Binder coverage')}
function rand(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}function gray(a){let n=Math.round(255*Math.max(0,Math.min(1,a))**(1/2.2));return 'rgb('+n+','+n+','+n+')'}
function draw(){let asphalt=v.material==='asphalt',m=mode==='material'?(asphalt?.95:.8)*(1-v.wear):v.coverage,b=asphalt?.025:.32,g=.18,w=mode==='material'?v.wet:0,albedo=(g*(1-m)+b*m)*(1-.35*w),rough=.75*(1-m)+(asphalt?.35:.65)*m;ctx.clearRect(0,0,600,240);ctx.fillStyle=gray(b*(1-.35*w));ctx.fillRect(0,0,600,240);
for(let i=0;i<700;i++){let x=rand(i*5)*600,y=rand(i*5+1)*240,r=3+rand(i*5+2)*13;ctx.beginPath();for(let j=0;j<7;j++){let a=j*Math.PI*2/7,rr=r*(.65+.35*rand(i*11+j));let X=x+Math.cos(a)*rr,Y=y+Math.sin(a)*rr;j?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.closePath();let covered=rand(i*5+3)<m;ctx.fillStyle=gray((covered?b:g)*(.65+.7*rand(i*5+4))*(1-.35*w));ctx.fill()}
if(mode==='material'){let grad=ctx.createRadialGradient(300,105,0,300,105,120);grad.addColorStop(0,'rgba(255,255,255,'+(.12+w*.5)+')');grad.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,600,240)}
if(mode==='layer'){ctx.fillStyle='#222';ctx.fillRect(0,0,600,240);ctx.font='18px system-ui';ctx.fillStyle='#eee';ctx.fillText('Spatial mix',30,30);ctx.fillText('Vertical coat',330,30);for(let i=0;i<20;i++){ctx.fillStyle=rand(i)<m?'#49413b':'#aaa';ctx.fillRect(30+i*12,85,12,95)}ctx.fillStyle='#aaa';ctx.fillRect(330,100,240,80);ctx.fillStyle='rgba(70,160,200,'+m+')';ctx.fillRect(330,80,240,20);ctx.fillStyle='#eee';ctx.fillText('Side-by-side regions',30,215);ctx.fillText('Layer above substrate',330,215)}
stats.textContent='Coverage '+(m*100).toFixed(0)+'% | Linear diffuse '+albedo.toFixed(3)+' | Base roughness '+rough.toFixed(2)+' | Wet coat weight '+w.toFixed(2);note.textContent=mode==='layer'?'Mix = (1−m) f_aggregate + m f_binder. Coat = vertical interface; a clear coat alone cannot reproduce absorbing bitumen. Diagram is conceptual.':'Illustrative procedural swatch, not a measured BRDF or physically rendered material. Values are artistic starting points; wetness darkening is heuristic.'}
draw()</script></html>
